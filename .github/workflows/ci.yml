# Unit tests plus an end-to-end smoke test (real server, fake `claude` in a
# PTY) on Linux and macOS. Needs no Claude Code install or tokens; the
# live checks against real Claude Code run in claude-code-watch.yml.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        method: [pipx, venv]
    runs-on: ${{ matrix.os }}
    name: install.sh (${{ matrix.method }}) on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure pipx
        if: matrix.method == 'pipx'
        run: command -v pipx || python -m pip install pipx
      - name: Run install.sh against this checkout
        env:
          TYPESET_CLAUDE_SOURCE: ${{ github.workspace }}
          TYPESET_CLAUDE_METHOD: ${{ matrix.method }}
        run: bash install.sh
      - name: Installed command runs
        # Runner images point pipx's bin dir elsewhere (e.g. /opt/pipx_bin).
        run: '"$(command -v typeset-claude || echo ~/.local/bin/typeset-claude)" --help'
