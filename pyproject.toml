[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-typesetter"
version = "0.1.0"
description = "Run Claude Code in a browser window with prose in a serif font and code in monospace"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lucas Ross" }]
license-files = ["LICENSE"]
dependencies = ["pyte>=0.8", "aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/lucjross/claude-code-typesetter"

[project.scripts]
typeset-claude = "typesetter.server:main"

[tool.setuptools]
packages = ["typesetter"]

[tool.setuptools.package-data]
typesetter = ["static/*"]
